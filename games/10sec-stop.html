<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B級ゲームパーク｜ピタッとストップ！10秒チャレンジ</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f1e8;
      color: #222;
      text-align: center;
    }

    header {
      padding: 18px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: #555;
    }

    .game-card {
      width: min(92vw, 480px);
      margin: 18px auto;
      padding: 20px;
      box-sizing: border-box;
      background: #fffaf0;
      border: 4px solid #222;
      border-radius: 18px;
      box-shadow: 6px 6px 0 #222;
    }

    .game-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .rule {
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .timer {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 18px 0;
    }

    .target {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    button {
      width: 86%;
      max-width: 320px;
      padding: 16px 20px;
      margin: 8px auto;
      display: block;
      border: 3px solid #222;
      border-radius: 14px;
      background: #ffd84d;
      color: #222;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 4px 4px 0 #222;
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #222;
    }

    .sub-button {
      background: #e8e8e8;
      font-size: 16px;
      padding: 12px 16px;
    }

    .result {
      min-height: 74px;
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.6;
      font-weight: 700;
    }

    .score {
      font-size: 22px;
      font-weight: 900;
    }

    .best {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }

    footer {
      font-size: 12px;
      color: #666;
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>B級ゲームパーク</h1>
    <p class="subtitle">1分で遊べる、ちょっと変なミニゲーム集。</p>
  </header>

  <main class="game-card">
    <div class="game-title">ピタッとストップ！10秒チャレンジ</div>
    <p class="rule">
      スタートを押したら時間が進みます。<br>
      10.00秒にできるだけ近いところでストップしてください。
    </p>

    <div class="target">目標：10.00秒</div>
    <div id="timer" class="timer">0.00</div>

    <button id="mainButton">スタート</button>
    <button id="resetButton" class="sub-button">リセット</button>

    <div id="result" class="result">
      まずはスタートを押してください。
    </div>
    <div id="best" class="best"></div>
  </main>

  <footer>
    B級ゲームパーク｜実験中
  </footer>

  <script>
    const timerEl = document.getElementById("timer");
    const resultEl = document.getElementById("result");
    const bestEl = document.getElementById("best");
    const mainButton = document.getElementById("mainButton");
    const resetButton = document.getElementById("resetButton");

    const TARGET = 10.00;
    let startTime = 0;
    let currentTime = 0;
    let timerId = null;
    let isRunning = false;

    function formatTime(seconds) {
      return seconds.toFixed(2);
    }

    function updateBestDisplay() {
      const best = localStorage.getItem("bgamepark_10sec_best");
      if (best !== null) {
        bestEl.textContent = `ベスト記録：${Number(best).toFixed(2)}秒差`;
      } else {
        bestEl.textContent = "ベスト記録：まだありません";
      }
    }

    function startGame() {
      isRunning = true;
      startTime = performance.now();
      resultEl.textContent = "10.00秒だと思ったらストップ！";
      mainButton.textContent = "ストップ";

      timerId = setInterval(() => {
        currentTime = (performance.now() - startTime) / 1000;
        timerEl.textContent = formatTime(currentTime);
      }, 20);
    }

    function stopGame() {
      isRunning = false;
      clearInterval(timerId);

      currentTime = (performance.now() - startTime) / 1000;
      const diff = Math.abs(currentTime - TARGET);
      timerEl.textContent = formatTime(currentTime);

      let message = "";
      if (diff <= 0.03) {
        message = "神ピタ！ほぼ10秒です。";
      } else if (diff <= 0.10) {
        message = "かなり惜しい！";
      } else if (diff <= 0.30) {
        message = "いい感じです。";
      } else if (diff <= 1.00) {
        message = "まあまあです。";
      } else {
        message = "B級らしいズレ方です。";
      }

      const score = Math.max(0, Math.round(1000 - diff * 1000));

      resultEl.innerHTML = `
        ${message}<br>
        <span class="score">スコア：${score}点</span><br>
        10秒との差：${diff.toFixed(2)}秒
      `;

      const best = localStorage.getItem("bgamepark_10sec_best");
      if (best === null || diff < Number(best)) {
        localStorage.setItem("bgamepark_10sec_best", diff);
      }

      updateBestDisplay();
      mainButton.textContent = "もう一回";
    }

    function resetGame() {
      isRunning = false;
      clearInterval(timerId);
      currentTime = 0;
      timerEl.textContent = "0.00";
      resultEl.textContent = "まずはスタートを押してください。";
      mainButton.textContent = "スタート";
    }

    mainButton.addEventListener("click", () => {
      if (isRunning) {
        stopGame();
      } else {
        resetGame();
        startGame();
      }
    });

    resetButton.addEventListener("click", resetGame);

    updateBestDisplay();
  </script>
</body>
</html>
