<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B級ゲームパーク｜サクサク仕分けパニック</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f1e8;
      color: #222;
      text-align: center;
    }

    header {
      padding: 18px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin: 6px 0 0;
      font-size: 14px;
      color: #555;
    }

    .game-card {
      width: min(92vw, 480px);
      margin: 18px auto;
      padding: 20px;
      box-sizing: border-box;
      background: #fffaf0;
      border: 4px solid #222;
      border-radius: 18px;
      box-shadow: 6px 6px 0 #222;
    }

    .game-title {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .rule {
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 16px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 12px 0 18px;
      font-weight: 800;
    }

    .status-box {
      flex: 1;
      padding: 8px;
      background: #fff;
      border: 3px solid #222;
      border-radius: 12px;
    }

    .item-box {
      margin: 18px auto;
      padding: 18px 10px;
      background: #fff;
      border: 4px solid #222;
      border-radius: 18px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .item-emoji {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .item-name {
      font-size: 24px;
      font-weight: 900;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 3px solid #222;
      border-radius: 14px;
      color: #222;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 4px 4px 0 #222;
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #222;
    }

    .choice-button {
      flex: 1;
      padding: 18px 8px;
      font-size: 20px;
      background: #ffd84d;
    }

    .start-button {
      width: 86%;
      max-width: 320px;
      padding: 16px 20px;
      margin: 8px auto;
      display: block;
      background: #ffd84d;
      font-size: 20px;
    }

    .sub-button {
      width: 86%;
      max-width: 320px;
      padding: 12px 16px;
      margin: 8px auto;
      display: block;
      background: #e8e8e8;
      font-size: 16px;
    }

    .result {
      min-height: 70px;
      margin-top: 16px;
      font-size: 16px;
      line-height: 1.6;
      font-weight: 700;
    }

    .score {
      font-size: 22px;
      font-weight: 900;
    }

    .best {
      margin-top: 8px;
      font-size: 14px;
      color: #555;
    }

    a.back {
      display: inline-block;
      margin-top: 18px;
      color: #222;
      font-weight: 800;
    }

    footer {
      font-size: 12px;
      color: #666;
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>B級ゲームパーク</h1>
    <p class="subtitle">1分で遊べる、ちょっと変なミニゲーム集。</p>
  </header>

  <main class="game-card">
    <div class="game-title">サクサク仕分けパニック</div>
    <p class="rule">
      出てきたアイテムを<br>
      「食べもの」か「道具」にすばやく仕分けよう！
    </p>

    <div class="status">
      <div class="status-box">残り：<span id="time">30</span>秒</div>
      <div class="status-box">スコア：<span id="score">0</span></div>
      <div class="status-box">コンボ：<span id="combo">0</span></div>
    </div>

    <div class="item-box">
      <div id="itemEmoji" class="item-emoji">🍙</div>
      <div id="itemName" class="item-name">準備中</div>
    </div>

    <button id="startButton" class="start-button">スタート</button>

    <div class="buttons">
      <button id="foodButton" class="choice-button">食べもの</button>
      <button id="toolButton" class="choice-button">道具</button>
    </div>

    <button id="resetButton" class="sub-button">リセット</button>

    <div id="result" class="result">
      スタートを押してください。
    </div>
    <div id="best" class="best"></div>

    <a class="back" href="../index.html">トップへ戻る</a>
  </main>

  <footer>
    B級ゲームパーク｜実験中
  </footer>

  <script>
    const items = [
      { emoji: "🍙", name: "おにぎり", type: "food" },
      { emoji: "🍎", name: "りんご", type: "food" },
      { emoji: "🍛", name: "カレー", type: "food" },
      { emoji: "🍩", name: "ドーナツ", type: "food" },
      { emoji: "🥤", name: "ジュース", type: "food" },
      { emoji: "🔧", name: "レンチ", type: "tool" },
      { emoji: "✂️", name: "ハサミ", type: "tool" },
      { emoji: "🔦", name: "ライト", type: "tool" },
      { emoji: "🪛", name: "ドライバー", type: "tool" },
      { emoji: "🧹", name: "ほうき", type: "tool" }
    ];

    const timeEl = document.getElementById("time");
    const scoreEl = document.getElementById("score");
    const comboEl = document.getElementById("combo");
    const itemEmojiEl = document.getElementById("itemEmoji");
    const itemNameEl = document.getElementById("itemName");
    const resultEl = document.getElementById("result");
    const bestEl = document.getElementById("best");

    const startButton = document.getElementById("startButton");
    const foodButton = document.getElementById("foodButton");
    const toolButton = document.getElementById("toolButton");
    const resetButton = document.getElementById("resetButton");

    let currentItem = null;
    let score = 0;
    let combo = 0;
    let timeLeft = 30;
    let isPlaying = false;
    let timerId = null;

    function updateBestDisplay() {
      const best = localStorage.getItem("bgamepark_sort_panic_best");
      if (best !== null) {
        bestEl.textContent = `ベストスコア：${best}点`;
      } else {
        bestEl.textContent = "ベストスコア：まだありません";
      }
    }

    function setButtonsEnabled(enabled) {
      foodButton.disabled = !enabled;
      toolButton.disabled = !enabled;
    }

    function pickItem() {
      const index = Math.floor(Math.random() * items.length);
      currentItem = items[index];
      itemEmojiEl.textContent = currentItem.emoji;
      itemNameEl.textContent = currentItem.name;
    }

    function updateStatus() {
      timeEl.textContent = timeLeft;
      scoreEl.textContent = score;
      comboEl.textContent = combo;
    }

    function startGame() {
      score = 0;
      combo = 0;
      timeLeft = 30;
      isPlaying = true;
      resultEl.textContent = "どんどん仕分けよう！";
      startButton.style.display = "none";
      setButtonsEnabled(true);
      pickItem();
      updateStatus();

      timerId = setInterval(() => {
        timeLeft -= 1;
        updateStatus();

        if (timeLeft <= 0) {
          finishGame();
        }
      }, 1000);
    }

    function finishGame() {
      isPlaying = false;
      clearInterval(timerId);
      setButtonsEnabled(false);
      startButton.style.display = "block";
      startButton.textContent = "もう一回";

      itemEmojiEl.textContent = "🏁";
      itemNameEl.textContent = "終了！";

      let comment = "";
      if (score >= 250) {
        comment = "仕分け名人です。";
      } else if (score >= 150) {
        comment = "かなりサクサクです。";
      } else if (score >= 80) {
        comment = "いい感じです。";
      } else {
        comment = "B級らしいバタバタ感です。";
      }

      resultEl.innerHTML = `
        ${comment}<br>
        <span class="score">最終スコア：${score}点</span>
      `;

      const best = localStorage.getItem("bgamepark_sort_panic_best");
      if (best === null || score > Number(best)) {
        localStorage.setItem("bgamepark_sort_panic_best", score);
      }

      updateBestDisplay();
    }

    function choose(type) {
      if (!isPlaying || currentItem === null) return;

      if (type === currentItem.type) {
        combo += 1;
        score += 10 + Math.min(combo, 10);
        resultEl.textContent = "正解！";
      } else {
        combo = 0;
        score = Math.max(0, score - 5);
        resultEl.textContent = "ちがう！スコア少しダウン。";
      }

      updateStatus();
      pickItem();
    }

    function resetGame() {
      isPlaying = false;
      clearInterval(timerId);
      score = 0;
      combo = 0;
      timeLeft = 30;
      currentItem = null;

      itemEmojiEl.textContent = "🍙";
      itemNameEl.textContent = "準備中";
      resultEl.textContent = "スタートを押してください。";
      startButton.style.display = "block";
      startButton.textContent = "スタート";
      setButtonsEnabled(false);
      updateStatus();
    }

    startButton.addEventListener("click", startGame);
    foodButton.addEventListener("click", () => choose("food"));
    toolButton.addEventListener("click", () => choose("tool"));
    resetButton.addEventListener("click", resetGame);

    resetGame();
    updateBestDisplay();
  </script>
</body>
</html>
