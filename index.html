<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B級ゲームパーク</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f1e8;
      color: #222;
      text-align: center;
    }

    header {
      padding: 24px 12px 12px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #555;
      font-size: 15px;
    }

    .game-list {
      width: min(92vw, 520px);
      margin: 24px auto;
    }

    .game-card {
      display: block;
      padding: 18px;
      margin-bottom: 18px;
      background: #fffaf0;
      border: 4px solid #222;
      border-radius: 18px;
      box-shadow: 6px 6px 0 #222;
      color: #222;
      text-decoration: none;
      text-align: left;
    }

    .game-title {
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .game-desc {
      font-size: 14px;
      color: #555;
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 8px;
      border: 2px solid #222;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #ffd84d;
    }

    footer {
      font-size: 12px;
      color: #666;
      margin: 28px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>B級ゲームパーク</h1>
    <p class="subtitle">1分で遊べる、ちょっと変なミニゲーム集。</p>
  </header>

  <main class="game-list">
    <a class="game-card" href="games/10sec-stop.html">
      <div class="game-title">ピタッとストップ！10秒チャレンジ</div>
      <div class="game-desc">
        10.00秒にできるだけ近いところでストップするだけの、シンプルなタイミングゲームです。
      </div>
      <div class="tag">タイミング</div>
    </a>
  </main>
    <a class="game-card" href="games/sort-panic.html">
      <div class="game-title">サクサク仕分けパニック</div>
      <div class="game-desc">
        出てきたアイテムを「食べもの」か「道具」にすばやく仕分ける、判断スピード系ミニゲームです。
      </div>
      <div class="tag">仕分け</div>
    </a>

  
  <footer>
    B級ゲームパーク｜実験中
  </footer>
</body>
</html>
